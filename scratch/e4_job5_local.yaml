# job 5's local reading (notes/e4-job5-preregistration.md section 3), as run in the container: job 3's local frames
# (13 cells: 10 calibration, 3 held out, from the container's own MB-pol MD, not in the repository) and job 4's local
# caches at 2.0 A (job4/local/edge2.0: arm C's stages 1 and 2, arm D's and Dx's third stages), copied into
# job5/local/edge2.0, so that arms C, D and Dx come from their caches and arm D' (Da) chains on arm C's stage 2. Da's
# config is arm D's (job4/local/armD.yaml) with training.readout.finite_k.anchor true. Run from the directory that
# holds the local data:
#   python scripts/e4_water.py kread --config scratch/e4_job5_local.yaml --out_dir job5/local \
#       --out job5/local/kread_edge2.0.json
# Readings: scratch/e4_job5_local.json.
data:
  dir: e4_job1_local/data
  probes: e4_job1_local/data/probes_mbpol.npz
  response: job1/sweep/response_local.npz
  response_k: job3/local/response_k_local.npz
liquid:
  calibration_frames: 10
  heldout_frames: 3
model:
  mutual_edge_angstrom: 2.0
kread:
  rung: M_16C2pm_us
  arms:
    C: {config: job3/local/armC.yaml, out_dir: job5/local/edge2.0}
    D: {config: job4/local/armD.yaml, out_dir: job5/local/edge2.0}
    Dx: {config: job4/local/armD.yaml, out_dir: job5/local/edge2.0, set: {training: {readout: {finite_k: {weight: 0.0}}}}}
    Da: {config: job4/local/armD.yaml, out_dir: job5/local/edge2.0, set: {training: {readout: {finite_k: {anchor: true}}}}}
  splits: [heldout, calibration]
  locality: null
  contact: {reference: C, frames: test}

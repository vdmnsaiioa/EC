[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sseft"
version = "0.0.4"
description = "Scale-separated EFT model: E_0 + IR bands on learned sources (JAX harness)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["jax>=0.4.30", "optax>=0.2", "numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["sseft"]

[tool.pytest.ini_options]
testpaths = ["tests"]

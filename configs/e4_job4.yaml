# E4, job 4, arm D (v0.0.28; pre-registration notes/e4-job4-preregistration.md): arm C, then its read-out's orders >= 1
# calibrated on MB-pol's finite-k response. Job 3 read arm C's far-probe orders >= 1 as wrong at the cutoff's scale
# (chi(k2) -11.0 %, its order-0 sector +3.3 %; notes/e4-job3-results.md): the k = 0 data set the order-0 coefficient
# (arm C), and the response's k-dependence sets the orders >= 1 (the derivative counting, eft-of-lss-workflow.md
# section 5). A third matching stage moves the orders >= 1 alone, on the far probes and every calibration cell's
# susceptibility in the 12 plane-wave modes of job 3 (data/e4/response_k_mbpol.npz), the probes' ridge kept; the read-out
# is then held through training as before.
#
#   the matching level first (run_e4_job4.sbatch, three tasks, one per mutual edge; no training):
#   python scripts/e4_water.py kread --config configs/e4_job4.yaml --out_dir results/e4_job4 --only C,C0,D,Dx \
#       --out results/e4_job4/kread_edge2.0.json      (and C@1.5,C0@1.5,D@1.5 and C@2.5,C0@2.5,D@2.5)
#   python scripts/e4_report.py --job4 results/e4_job4
#   then, if it holds, training (run_e4_job4_train.sbatch, one run a task):
#   python scripts/e4_water.py train --config configs/e4_job4.yaml --task 0 --out_dir results/e4_job4/edge2.0
#
# Every value of the experiment is in this file. It differs from configs/e4_job2c.yaml in data.response_k, liquid_k,
# training.readout.finite_k and kread only (tests/test_arm_d.py); the liquid block is arm C's to the letter, so arm C's
# cached stages carry over to arm D.
experiment:
  type: e4

data:
  dir: data/e4                      # scripts/e4_data.py assemble: {train,valid,test}_n{64,128,256}.npz
  train_size: 64
  eval_sizes: [64, 128, 256]
  probes: data/e4/probes_mbpol.npz  # scripts/e4_water.py probes
  response: data/e4/response_mbpol.npz   # scripts/e4_water.py response (run_e4_response.sbatch)
  response_k: data/e4/response_k_mbpol.npz   # job 3's finite-k response (run_e4_response_k.sbatch)

liquid:                             # MB-pol's induced dipoles and field response in liquid cells (MBX, clamped nuclei)
  calibration_frames: 30            # spread over train_n64's frames (every trajectory)
  heldout_frames: 10                # spread over test_n64's frames
  delta: 1.0e-4                     # the uniform field's central-difference step, e/A^2 (the response is linear)

liquid_k:                           # job 3's modes of each frame: 3 axes x 2 harmonics x 2 phases = 12
  axes: [0, 1, 2]
  harmonics: [1, 2]                 # k = 0.506 and 1.011 / A in the 64-molecule cells (L = 12.43 A)
  phases: [0, 1]                    # cos, sin
  delta: 1.0e-4

model:                              # E3-QP8's (configs/water_qaqua_pol8.yaml), in a cell
  r_cut_angstrom: 6.0
  features: 32
  band_edge_angstrom: 0.75
  response_edge_angstrom: 0.75
  mutual_edge_angstrom: 2.0         # v0.0.23 (Rung.bf_l_mutual): the mutual response's dipole tensor alone smeared at
                                    # 2.0 A, fixed in advance (notes/e4-response-regulator.md section 1); the field the
                                    # read-out reads stays at the response edge, 0.75 A
  analytic_envelope_angstrom: 4.0
  rs_over_l1: 0.0
  charge_neutrality: fragment
  ewald_b_max: 4.0                  # k_max = 2 b_max / l_1; n_max per cell (periodic.n_max_for)
  solver: gmres                     # the mutual response in a cell: GMRES with implicit derivatives (the timing, 2 Nov)
  solver_tol: 1.0e-10
  K: 8                              # the dispersion band's Casimir-Polder grid (MB-pol's c6, water.mbpol_dispersion_pins)
  omega0: 0.3

rungs: [M_16C2pm_us, M_16C2pm]    # the frozen form and its field-term ablation: arm C's, then the third stage
seeds: [0, 1, 2, 3]

training:
  adam: {steps: 3000, batch_size: 6, learning_rate: 3.0e-3, final_learning_rate_ratio: 0.01,
         beta1: 0.9, beta2: 0.999, epsilon: 1.0e-8}
  lbfgs: {steps: 50, chunk_size: 12, memory_size: 10, max_linesearch_steps: 20}
  loss:
    energy_weight: 100.0            # E3-QP2 on: the per-atom energy term, against force_weight 1
    force_weight: 1.0
    forces: rigid                   # each molecule's net force and torque (sseft.train.rigid_force_sums)
  readout:                          # E3-QP2's matching, on MB-pol's probes, before training; held through it
    orders: all
    solve_iterations: 4
    ridge: 1.0e-8
    ridge_selection: groups
    solve_chunk: 64
    liquid:                         # arm C: then calibrated on the liquid cells (match_readout's second stage)
      weight: 0.1                   # a 1 % error of the cells' response costs about the far probes' matched objective
      orders: zero                  # v0.0.25: the order-0 columns and the node term alone (arm B: every order)
      alpha_ref_angstrom3: 1.4075   # the response rows' unit per molecule: MB-pol's monomer polarisability
      mu_ref_eangstrom: 0.15        # the dipole rows' unit per molecule (MB-pol's induced dipole in the liquid ~0.17 e A rms)
    finite_k:                       # arm D (v0.0.28): then the orders >= 1 alone on the far probes and the calibration
      weight: 0.1                   # cells' chi_mode (12 a cell), each relative to MB-pol's mean at its harmonic; 0.1:
                                    # a 1 % error costs about the far probes' matched objective. The k = 0 rows are not
                                    # in this stage (they reach the orders >= 1 only through the cells' zero-field dipole)

probes:                             # E3-QP8's probe settings and seeds (configs/water_qaqua_pol8.yaml), on MB-pol
  distances_angstrom: [8.0, 10.0, 12.0, 15.0]
  train_per_distance: 2
  train_cores: 16
  train_core_sizes: [3, 4, 5]
  test_per_distance: 10
  test_cores: 2
  seed: 400
  mc_steps: 300
  temperature_kelvin: 300.0
  min_oo_angstrom: 2.7
  min_atom_distance_angstrom: 1.7
  far_trimers: 40                   # Theorem 2's T5: three molecules, every intermolecular pair beyond 6.5 A (> r_c)
  trimer_seed: 900
  trimer_min_angstrom: 6.5
  trimer_max_oo_angstrom: 12.0

reading:
  eps_frames: 10                    # eps_inf on the first test frames of the training size (rungs with a response)
  splits: [train, valid, test]      # at 128 and 256 molecules every split is unseen by a model trained at 64

kread:                              # the matching level (scripts/e4_water.py kread): no training
  rung: M_16C2pm_us
  arms:
    C: {config: configs/e4_job2c.yaml, out_dir: results/e4_job2c}            # arm C, from job 2c's cache
    D: {config: configs/e4_job4.yaml, out_dir: results/e4_job4/edge2.0}      # arm D: arm C, then the third stage
    Dx: {config: configs/e4_job4.yaml, out_dir: results/e4_job4/edge2.0,     # the control: no finite-k rows, the
         set: {training: {readout: {finite_k: {weight: 0.0}}}}}              # orders >= 1 re-solved on the probes alone
    C@1.5: {config: configs/e4_job2c.yaml, out_dir: results/e4_job4/edge1.5, set: {model: {mutual_edge_angstrom: 1.5}}}
    D@1.5: {config: configs/e4_job4.yaml, out_dir: results/e4_job4/edge1.5, set: {model: {mutual_edge_angstrom: 1.5}}}
    C@2.5: {config: configs/e4_job2c.yaml, out_dir: results/e4_job4/edge2.5, set: {model: {mutual_edge_angstrom: 2.5}}}
    D@2.5: {config: configs/e4_job4.yaml, out_dir: results/e4_job4/edge2.5, set: {model: {mutual_edge_angstrom: 2.5}}}
  order_zero_of: {C: C0, C@1.5: C0@1.5, C@2.5: C0@2.5}                     # H3's order 0 at each edge
  splits: [heldout, calibration]
  locality: null

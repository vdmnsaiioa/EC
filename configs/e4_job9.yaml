# E4, job 9 (notes/e4-job9-preregistration.md): why job 7's learned charges stopped short of the data's scale, and
# whether the charge head's own learning rate gets them there (v0.0.33).  Job 7's warm starts M_1w050 and M_1w150 again,
# traced; M_1x050 and M_1x150, the same with the charge head (its layers and species offsets) at 10 times the rest's
# learning rate (e4_water.CHARGE_LR, train.fit's charge_lr_scale); M_1x000, the same started near zero.  Every run traces
# its charges (training.trace): the learned dipole every 100 Adam steps on 4 training frames, the pull on the charges'
# scale on every batch, and the objective along that scale with the rest held at the end of Adam and of training.
# Everything else is job 7's: MB-pol's 64-molecule cells, the readings on every frame of 64-256 molecules, the probes
# and T5; seeds 0 and 1.
#
#   python scripts/e4_water.py train --config configs/e4_job9.yaml --rungs M_1x050 --seeds 0 --out_dir results/e4_job9
#   python scripts/e4_job9.py --out_dir results/e4_job9 --job7_dir results/e4_job7 --job6_dir results/e4_job6  # K9.1-K9.5
#   python scripts/e4_sumrules.py model --config configs/e4_job9.yaml --rung M_1x050 \
#       --params results/e4_job9/M_1x050_seed0.params.pkl --label M_1x050_s0       # the charges on S0's frames (K9.6)
#   python scripts/e4_sumrules.py read --gate_dir results/e4_job6 --job7_dir results/e4_job7 --job9_dir results/e4_job9
#
# (run_e4_job9.sbatch: two tasks of five runs, one after another.)
experiment:
  type: e4

data:
  dir: data/e4                      # scripts/e4_data.py assemble: {train,valid,test}_n{64,128,256}.npz
  train_size: 64
  eval_sizes: [64, 128, 256]
  probes: data/e4/probes_mbpol.npz  # scripts/e4_water.py probes

model:                              # E3-QP8's (configs/water_qaqua_pol8.yaml), in a cell
  r_cut_angstrom: 6.0
  features: 32
  band_edge_angstrom: 0.75
  response_edge_angstrom: 0.75
  mutual_edge_angstrom: null        # v0.0.23 (Rung.bf_l_mutual): the mutual response's dipole tensor alone smeared at this
                                    # edge, the field the read-out reads left at the response edge; null: the response edge
  analytic_envelope_angstrom: 4.0
  rs_over_l1: 0.0
  charge_neutrality: fragment
  ewald_b_max: 4.0                  # k_max = 2 b_max / l_1; n_max per cell (periodic.n_max_for)
  solver: gmres                     # the mutual response in a cell: GMRES with implicit derivatives (the timing, 2 Nov)
  solver_tol: 1.0e-10
  K: 8                              # the dispersion band's Casimir-Polder grid (MB-pol's c6, water.mbpol_dispersion_pins)
  omega0: 0.3

rungs: [M_1w050, M_1w150, M_1x050, M_1x150, M_1x000]
seeds: [0, 1]

training:
  adam: {steps: 3000, batch_size: 6, learning_rate: 3.0e-3, final_learning_rate_ratio: 0.01,
         beta1: 0.9, beta2: 0.999, epsilon: 1.0e-8}
  lbfgs: {steps: 50, chunk_size: 12, memory_size: 10, max_linesearch_steps: 20}
  loss:
    energy_weight: 100.0            # E3-QP2 on: the per-atom energy term, against force_weight 1
    force_weight: 1.0
    forces: rigid                   # each molecule's net force and torque (sseft.train.rigid_force_sums)
  trace: {every: 100, frames: 4}    # v0.0.33: the learned charges traced (e4_water.charge_diagnostics)
  readout:                          # E3-QP2's matching, on MB-pol's probes, before training; held through it
    orders: all
    solve_iterations: 4
    ridge: 1.0e-8
    ridge_selection: groups
    solve_chunk: 64

probes:                             # E3-QP8's probe settings and seeds (configs/water_qaqua_pol8.yaml), on MB-pol
  distances_angstrom: [8.0, 10.0, 12.0, 15.0]
  train_per_distance: 2
  train_cores: 16
  train_core_sizes: [3, 4, 5]
  test_per_distance: 10
  test_cores: 2
  seed: 400
  mc_steps: 300
  temperature_kelvin: 300.0
  min_oo_angstrom: 2.7
  min_atom_distance_angstrom: 1.7
  far_trimers: 40                   # Theorem 2's T5: three molecules, every intermolecular pair beyond 6.5 A (> r_c)
  trimer_seed: 900
  trimer_min_angstrom: 6.5
  trimer_max_oo_angstrom: 12.0

reading:
  eps_frames: 10                    # eps_inf on the first test frames of the training size (rungs with a response)
  splits: [train, valid, test]      # at 128 and 256 molecules every split is unseen by a model trained at 64
